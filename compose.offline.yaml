name: resso

services:
  resso:
    image: resso:${RESSO_VERSION:-v0.9.16}
    container_name: resso
    restart: unless-stopped
    ports:
      # The container always binds :8080; what an operator changes is the port
      # the host publishes. Letting both move would be two values to keep in
      # step, and the health check follows the one inside.
      - "${PUBLISHED_PORT:-8080}:8080"
    environment:
      POSTGRES_DSN: ${POSTGRES_DSN:?POSTGRES_DSN is required}
      BOOTSTRAP_ADMIN: ${BOOTSTRAP_ADMIN:?BOOTSTRAP_ADMIN is required}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?BOOTSTRAP_ADMIN_PASSWORD is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      DATA_ENCRYPTION_KEYS: ${DATA_ENCRYPTION_KEYS:-}
      DIGEST_KEYS: ${DIGEST_KEYS:-}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/resso", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
