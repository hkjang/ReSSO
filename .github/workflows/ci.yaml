name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # golangci-lint runs before the frontend install so that its file walker
      # never descends into web/node_modules.
      - name: Lint backend
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
      - name: Check for known vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./cmd/... ./internal/... ./webui/...
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Lint frontend
        working-directory: web
        run: npm ci && npm run lint

  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: resso
          POSTGRES_PASSWORD: integration-password
          POSTGRES_DB: resso
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resso -d resso"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The optional trigram indexes are only created when pg_trgm is present,
      # so install it here to exercise that path.
      - name: Enable optional PostgreSQL extensions
        env:
          PGPASSWORD: integration-password
        run: psql -h 127.0.0.1 -U resso -d resso -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm'
      - name: Test backend
        env:
          RESSO_TEST_POSTGRES_DSN: postgres://resso:integration-password@127.0.0.1:5432/resso?sslmode=disable
        run: go test -race -coverprofile=coverage.out ./... && go tool cover -func=coverage.out && go vet ./...
      - name: Build frontend
        working-directory: web
        run: npm ci && npm run test && npm run build
      - name: Integration smoke test
        shell: bash
        env:
          POSTGRES_DSN: postgres://resso:integration-password@127.0.0.1:5432/resso?sslmode=disable
          BOOTSTRAP_ADMIN: admin
          BOOTSTRAP_ADMIN_PASSWORD: integration-password-123
          ENCRYPTION_KEY: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
        run: |
          go build -o /tmp/resso ./cmd/resso
          /tmp/resso >/tmp/resso.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; cat /tmp/resso.log' EXIT
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/health/ready >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/health/ready >/dev/null
          bash ./scripts/smoke-test.sh http://127.0.0.1:8080 admin integration-password-123
      - name: Build image
        run: docker build --tag resso:ci .
      - name: Scan image for known vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: resso:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
