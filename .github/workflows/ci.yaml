name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # golangci-lint runs before the frontend install so that its file walker
      # never descends into web/node_modules.
      - name: Lint backend
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
      - name: Check for known vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./cmd/... ./internal/... ./webui/...
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Lint frontend
        working-directory: web
        run: npm ci && npm run lint

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The same script contributors run, so what CI exercises and what they
      # can reproduce cannot drift apart. It reuses the PostgreSQL service
      # above by leaving that container alone.
      - name: Start the integration test services
        run: |
          set -euo pipefail
          ./scripts/test-services.sh > "$RUNNER_TEMP/test-env.sh"
          cat "$RUNNER_TEMP/test-env.sh"
      - name: Test backend
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/test-env.sh"
          go test -race -coverprofile=coverage.out ./... && go tool cover -func=coverage.out && go vet ./...
      - name: Build frontend
        working-directory: web
        run: npm ci && npm run test && npm run build
      - name: Integration smoke test
        shell: bash
        env:
          # Its own database on the instance the services script started, so a
          # smoke run and the integration tests cannot tread on each other.
          POSTGRES_DSN: postgres://resso:resso@127.0.0.1:55439/smoke?sslmode=disable
          BOOTSTRAP_ADMIN: admin
          BOOTSTRAP_ADMIN_PASSWORD: integration-password-123
          ENCRYPTION_KEY: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
        run: |
          docker exec resso-test-pg psql -U resso -d postgres \
            -c 'CREATE DATABASE smoke' >/dev/null 2>&1 || true
          go build -o /tmp/resso ./cmd/resso
          /tmp/resso >/tmp/resso.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; cat /tmp/resso.log' EXIT
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/health/ready >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/health/ready >/dev/null
          bash ./scripts/smoke-test.sh http://127.0.0.1:8080 admin integration-password-123
      - name: Build image
        run: docker build --tag resso:ci .
      - name: Scan image for known vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: resso:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
