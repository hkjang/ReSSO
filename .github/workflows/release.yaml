name: Offline image release

on:
  push:
    tags:
      - "v*.*.*"
  # A release that was published by hand still needs its offline image. Without
  # this the only way to attach one is to delete and re-push the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build the offline image for"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: resso
          POSTGRES_PASSWORD: integration-password
          POSTGRES_DB: resso
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resso -d resso"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - name: Validate tag
        shell: bash
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          # Everything below names the release through this one variable, so a
          # dispatched run builds the tag it was given and not whatever branch
          # the workflow file was read from.
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "RELEASE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Test backend
        env:
          RESSO_TEST_POSTGRES_DSN: postgres://resso:integration-password@127.0.0.1:5432/resso?sslmode=disable
        run: go test ./... && go vet ./...
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Test frontend
        working-directory: web
        run: npm ci && npm run test && npm run build
      - name: Build offline image
        shell: bash
        run: |
          docker build --platform linux/amd64 \
            --build-arg "VERSION=${RELEASE_TAG}" \
            --build-arg "COMMIT=${RELEASE_COMMIT}" \
            --build-arg "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --tag "resso:${RELEASE_TAG}" .
          docker image inspect "resso:${RELEASE_TAG}" >/dev/null
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "resso:${RELEASE_TAG}")" = "linux/amd64"
      - name: Test built offline image
        shell: bash
        env:
          POSTGRES_DSN: postgres://resso:integration-password@127.0.0.1:5432/resso?sslmode=disable
          BOOTSTRAP_ADMIN: admin
          BOOTSTRAP_ADMIN_PASSWORD: integration-password-123
          ENCRYPTION_KEY: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
        run: |
          container_name=resso-release-smoke
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              docker logs "$container_name" 2>/dev/null || true
            fi
            docker rm -f "$container_name" >/dev/null 2>&1 || true
            exit "$status"
          }
          trap cleanup EXIT
          docker run --detach --name "$container_name" --network host \
            --read-only --tmpfs /tmp:size=16m,mode=1777 \
            --cap-drop ALL --security-opt no-new-privileges:true \
            -e POSTGRES_DSN -e BOOTSTRAP_ADMIN -e BOOTSTRAP_ADMIN_PASSWORD -e ENCRYPTION_KEY \
            "resso:${RELEASE_TAG}"
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/health/ready >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/health/ready >/dev/null
          curl -fsS http://127.0.0.1:8080/api/v1/meta | \
            jq -e --arg expected "$RELEASE_TAG" '.product == "ReSSO" and .version == $expected' >/dev/null
          bash ./scripts/smoke-test.sh http://127.0.0.1:8080 admin integration-password-123
      - name: Package offline image
        shell: bash
        run: |
          docker save "resso:${RELEASE_TAG}" | gzip -9 -n > "resso-${RELEASE_TAG}.tar.gz"
          gzip -t "resso-${RELEASE_TAG}.tar.gz"
          sha256sum "resso-${RELEASE_TAG}.tar.gz" > release-sha256.txt
      # What is published has to be loadable by the command the README gives,
      # from the two files as published and nothing else. Packaging was
      # verified up to this point and the reverse trip never was, so a change
      # to either the packaging or the loading script could ship a release that
      # an operator cannot bring in — the one step that happens where nobody
      # can fix it.
      - name: Load the published archive back, as an operator would
        shell: bash
        run: |
          docker image rm "resso:${RELEASE_TAG}"
          if docker image inspect "resso:${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "the image was still present, so the load below would prove nothing" >&2
            exit 1
          fi
          ./scripts/offline-load.sh "resso-${RELEASE_TAG}.tar.gz"
          docker image inspect "resso:${RELEASE_TAG}" >/dev/null
          # And a damaged archive has to be refused rather than half-loaded.
          cp "resso-${RELEASE_TAG}.tar.gz" damaged.tar.gz
          printf '\x00' | dd of=damaged.tar.gz bs=1 seek=64 conv=notrunc status=none
          sed "s/resso-${RELEASE_TAG}.tar.gz/damaged.tar.gz/" release-sha256.txt > damaged-sha256.txt
          if ./scripts/offline-load.sh damaged.tar.gz damaged-sha256.txt; then
            echo "a damaged archive was accepted" >&2
            exit 1
          fi
          rm -f damaged.tar.gz damaged-sha256.txt
      # A release published by hand before the tag was pushed used to make this
      # step fail, and the run failed with it: the archive was built, smoke
      # tested and loaded back, then thrown away. Attach to whatever release
      # the tag already has, and keep the notes that were written by hand.
      - name: Publish the release with the image archive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          archive="resso-${RELEASE_TAG}.tar.gz"
          digest="$(cut -d' ' -f1 release-sha256.txt)"
          notes="$(printf 'Docker image: `%s`\n\nArchive: `%s`\n\nSHA-256: `%s`' "resso:${RELEASE_TAG}" "$archive" "$digest")"
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" \
              "$archive#ReSSO offline Docker image" \
              "release-sha256.txt#SHA-256 checksum" \
              --clobber
            existing="$(gh release view "${RELEASE_TAG}" --json body --jq .body)"
            case "$existing" in
              *"$digest"*) ;;
              *) gh release edit "${RELEASE_TAG}" \
                   --notes "$(printf '%s\n\n---\n\n%s' "$existing" "$notes")" ;;
            esac
          else
            gh release create "${RELEASE_TAG}" \
              "$archive#ReSSO offline Docker image" \
              "release-sha256.txt#SHA-256 checksum" \
              --title "ReSSO ${RELEASE_TAG}" \
              --generate-notes \
              --notes "$notes"
          fi
          # Whatever route was taken, the release has to carry both files.
          attached="$(gh release view "${RELEASE_TAG}" --json assets --jq '[.assets[].name] | sort | join(",")')"
          test "$attached" = "release-sha256.txt,${archive}"
