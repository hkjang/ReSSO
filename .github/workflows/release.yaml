name: Offline image release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: resso
          POSTGRES_PASSWORD: integration-password
          POSTGRES_DB: resso
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resso -d resso"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate tag
        shell: bash
        run: |
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - name: Test backend
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./... && go vet ./...
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Test frontend
        working-directory: web
        run: npm ci && npm run test && npm run build
      - name: Integration smoke test
        shell: bash
        env:
          POSTGRES_DSN: postgres://resso:integration-password@127.0.0.1:5432/resso?sslmode=disable
          BOOTSTRAP_ADMIN: admin
          BOOTSTRAP_ADMIN_PASSWORD: integration-password-123
          ENCRYPTION_KEY: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
        run: |
          go build -o /tmp/resso ./cmd/resso
          /tmp/resso >/tmp/resso.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; cat /tmp/resso.log' EXIT
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/health/ready >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/health/ready >/dev/null
          bash ./scripts/smoke-test.sh http://127.0.0.1:8080 admin integration-password-123
      - name: Build offline image
        shell: bash
        run: |
          docker build --platform linux/amd64 \
            --build-arg "VERSION=${GITHUB_REF_NAME}" \
            --build-arg "COMMIT=${GITHUB_SHA}" \
            --build-arg "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --tag "resso:${GITHUB_REF_NAME}" .
          docker save "resso:${GITHUB_REF_NAME}" | gzip -9 -n > "resso-${GITHUB_REF_NAME}.tar.gz"
          docker image inspect "resso:${GITHUB_REF_NAME}" >/dev/null
          gzip -t "resso-${GITHUB_REF_NAME}.tar.gz"
          sha256sum "resso-${GITHUB_REF_NAME}.tar.gz" > release-sha256.txt
      - name: Create GitHub release with the image archive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          archive="resso-${GITHUB_REF_NAME}.tar.gz"
          digest="$(cut -d' ' -f1 release-sha256.txt)"
          notes="$(printf 'Docker image: `%s`\n\nArchive: `%s`\n\nSHA-256: `%s`' "resso:${GITHUB_REF_NAME}" "$archive" "$digest")"
          gh release create "${GITHUB_REF_NAME}" \
            "$archive#ReSSO offline Docker image" \
            "release-sha256.txt#SHA-256 checksum" \
            --title "ReSSO ${GITHUB_REF_NAME}" \
            --generate-notes \
            --notes "$notes"
