name: Offline image release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate tag
        shell: bash
        run: |
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - name: Test backend
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./... && go vet ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Test frontend
        working-directory: web
        run: npm ci && npm run test && npm run build
      - name: Build offline image
        shell: bash
        run: |
          docker build --platform linux/amd64 \
            --build-arg "VERSION=${GITHUB_REF_NAME}" \
            --build-arg "COMMIT=${GITHUB_SHA}" \
            --build-arg "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --tag "resso:${GITHUB_REF_NAME}" .
          docker save "resso:${GITHUB_REF_NAME}" | gzip -9 -n > "resso-${GITHUB_REF_NAME}.tar.gz"
          docker image inspect "resso:${GITHUB_REF_NAME}" >/dev/null
          gzip -t "resso-${GITHUB_REF_NAME}.tar.gz"
          sha256sum "resso-${GITHUB_REF_NAME}.tar.gz" > release-sha256.txt
      - name: Create GitHub release with the image archive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          archive="resso-${GITHUB_REF_NAME}.tar.gz"
          digest="$(cut -d' ' -f1 release-sha256.txt)"
          notes="$(printf 'Docker image: `%s`\n\nArchive: `%s`\n\nSHA-256: `%s`' "resso:${GITHUB_REF_NAME}" "$archive" "$digest")"
          gh release create "${GITHUB_REF_NAME}" "$archive#ReSSO offline Docker image" \
            --title "ReSSO ${GITHUB_REF_NAME}" \
            --generate-notes \
            --notes "$notes"
