name: resso-maintenance

services:
  resso-maintenance:
    image: resso:${RESSO_VERSION:-v0.9.25}
    profiles:
      - maintenance
    environment:
      POSTGRES_DSN: ${POSTGRES_DSN:?POSTGRES_DSN is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      DATA_ENCRYPTION_KEYS: ${DATA_ENCRYPTION_KEYS:-}
      DIGEST_KEYS: ${DIGEST_KEYS:-}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
